name: Validate package

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: normlanguage/registry/.github/actions/setup-norm@90b4d247fa4f5f2b620924d2cbc0553e89843700
        with:
          version: 0.27.29
      - name: Generate and validate Skill
        shell: bash
        run: |
          set -euo pipefail
          norm docs . --output build/api --skill SKILL.md
          python3 tests/check_api.py
          git diff --exit-code -- SKILL.md


